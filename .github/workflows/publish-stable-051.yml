# One-shot stable publication, triggered only when this workflow is introduced.
# Runs full Lua 5.1 tests before creating an immutable GitHub stable release.
name: Publish RBP v0.5.1
on:
  push:
    branches: [release/v0.5.1]
    paths:
      - '.github/workflows/publish-stable-051.yml'

permissions:
  contents: write

concurrency:
  group: reborn-build-planner-stable-051
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Maidenquinn/reborn-build-planner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test and artwork requirements
        run: python -m pip install pillow lupa==2.8
      - name: Retrieve public official data (authorized by project maintainer)
        run: python -I tools/fetch_catalog_public.py --out .local/catalog/public-preview
      - name: Generate catalogue
        env:
          RBP_CATALOG_DIR: .local/catalog/public-preview
        run: python -I tools/generate_catalog.py
      - name: Verify generated catalogue
        env:
          RBP_CATALOG_DIR: .local/catalog/public-preview
        run: python -I tests/py/test_generator.py
      - name: Generate original UI artwork
        run: |
          python -I tools/make_textures.py addon_lab/RebornPlannerThemeLab/Media
          python -I tools/make_ultimate_art.py addon_lab/RebornPlannerThemeLab/Media
      - name: Run full Lua 5.1 tests
        env:
          RBP_CATALOG_DIR: .local/catalog/public-preview
        run: python -I tools/run_lua_tests.py
      - name: Assemble and verify installable single-folder ZIP
        run: |
          python -I tools/package_addon.py --out dist/private-preview
          python - <<'PY'
          from pathlib import Path
          from shutil import copyfile
          from tools.validate_index_zip import validate
          z = list(Path('dist/private-preview').glob('RebornBuildPlanner-*-recette.zip'))
          assert len(z) == 1, z
          dest = Path('dist/RebornBuildPlanner-v0.5.1.zip')
          copyfile(z[0], dest)
          files, unpacked = validate(str(dest))
          assert files > 20
          print('Stable package verified:', dest, files, unpacked)
          PY
      - name: Create stable tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.1 >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace its immutable asset."
            exit 1
          fi
          gh release create v0.5.1 dist/RebornBuildPlanner-v0.5.1.zip \
            --target "$GITHUB_SHA" \
            --title "Reborn Build Planner v0.5.1" \
            --latest \
            --notes "RBP v0.5.1 adds Capture Current Build: save spells with ranks, equipped rings/trinkets/amulets and confirmed banishments into a new planner build without affecting the current build. Improves legendary amulet identification, tracks validated ban actions and preserves their run-specific journal through reloads. Provides an explicit preview and warns on missing/ambiguous information or planner limits rather than silently truncating. Includes the previously stable v0.5.0 planner, import/export, custom minimap launcher and read-only live HUD. No automated gameplay. Requires AzerothSurvivors and AzerothSurvivorsAPI. Extract the ZIP into Interface/AddOns; preserve SavedVariables."
